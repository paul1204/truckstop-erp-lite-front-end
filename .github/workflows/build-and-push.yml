name: Build & Package Flutter Frontend

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # Step 1: Check out source code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Set up Flutter SDK on the runner
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Step 3: Download Flutter dependencies
      - name: Install dependencies
        run: flutter pub get

      # Step 4: Compile Flutter Web for production (disable PWA service worker caching)
      - name: Build Flutter Web
        run: flutter build web --release --pwa-strategy=none

      # Step 5: Save static web build as a downloadable GitHub Artifact
      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: build/web/

      # Step 6: Log in to GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 7: Generate Docker image tags (handles lowercase repo name)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Step 8: Build Nginx Docker image and push to GHCR
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
