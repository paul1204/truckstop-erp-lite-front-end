# =============================================================================
# Rate Limiting Zones (Memory-efficient client IP tracking)
# =============================================================================
# 10MB zone tracks ~160,000 distinct IP addresses.
# - api_limit: 20 req/s to prevent DoS/brute-force on backend endpoints
# - general_limit: 50 req/s for static web assets (WASM, JS, images, fonts)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=50r/s;
limit_req_status 429;

server {
    listen 80;
    server_name localhost;

    # Suppress Nginx version disclosure in HTTP response headers
    server_tokens off;

    # Restrict maximum allowed request body size (mitigates payload buffer exhaustion)
    client_max_body_size 2m;

    # =========================================================================
    # HTTP Security Headers
    # =========================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # Dual-environment DNS Resolver:
    # - 127.0.0.11: Local Docker bridge network resolver
    # - fd12::10: Railway internal private network IPv6 DNS resolver
    # - ipv6=on: Mandatory for Railway private networking (.railway.internal)
    resolver 127.0.0.11 fd12::10 valid=10s ipv6=on;

    # Reverse proxy for backend API endpoints
    location /api/ {
        limit_except GET POST PUT PATCH OPTIONS {
            deny all;
        }

        limit_req zone=api_limit burst=30 nodelay;

        set $backend_url "${BACKEND_URL}";
        proxy_pass $backend_url$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # Temporary Reverse Proxy Routes:
    # Forward legacy non-/api/ backend endpoints until routes are normalized
    # under /api/ in the backend. Easily revertible by removing these blocks.
    # =========================================================================
    location /fuel/ {
        limit_except GET POST PUT PATCH OPTIONS {
            deny all;
        }

        limit_req zone=api_limit burst=20 nodelay;

        set $backend_url "${BACKEND_URL}";
        proxy_pass $backend_url$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /accounting/ {
        # Only allow safe reads and approved mutations; block unauthenticated DELETE
        limit_except GET POST PATCH OPTIONS {
            deny all;
        }

        limit_req zone=api_limit burst=20 nodelay;

        set $backend_url "${BACKEND_URL}";
        proxy_pass $backend_url$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /tank-status {
        limit_except GET OPTIONS {
            deny all;
        }

        limit_req zone=api_limit burst=20 nodelay;

        set $backend_url "${BACKEND_URL}";
        proxy_pass $backend_url$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_except GET HEAD OPTIONS {
            deny all;
        }

        limit_req zone=general_limit burst=100 nodelay;

        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
